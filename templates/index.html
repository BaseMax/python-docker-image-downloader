<!doctype html>
<html lang="en-US" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Download Docker images as tar files. Useful if you are located in places where DockerHub is blocked."
        />
        <meta
            name="keywords"
            content="download docker image, download docker image as file, docker image download, download docker image tar, offline docker images, docker save download, download image from Docker Hub, download container image, dockerhub download file, download docker images without docker pull"
        />
        <title>Docker Image Downloader</title>
        <link rel="icon" href="/logo.svg" type="image/svg+xml" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background-color: #fff;
            }

            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }

            .logo {
                margin-bottom: 28px;
            }

            .logo img {
                height: 92px;
            }

            .app-title {
                font-size: 22px;
                color: #3c4043;
                font-weight: 400;
                margin-bottom: 24px;
                letter-spacing: -0.2px;
            }

            .search-box {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .search-wrapper {
                display: flex;
                align-items: center;
                width: 584px;
                max-width: 90vw;
                height: 44px;
                border: 1px solid #dfe1e5;
                border-radius: 24px;
                padding: 0 14px;
                margin-bottom: 18px;
            }

            .search-wrapper:hover,
            .search-wrapper:focus-within {
                box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
                border-color: rgba(223, 225, 229, 0);
            }

            .search-input {
                flex: 1;
                border: none;
                outline: none;
                font-size: 16px;
                background: transparent;
            }

            .platform-row {
                display: none;
                align-items: center;
                gap: 8px;
                margin-bottom: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .platform-row.visible {
                display: flex;
            }

            .platform-label {
                font-size: 13px;
                color: #5f6368;
            }

            .platform-select {
                height: 32px;
                padding: 0 8px;
                font-size: 13px;
                border: 1px solid #dfe1e5;
                border-radius: 4px;
                color: #3c4043;
                background-color: #fff;
                cursor: pointer;
                outline: none;
            }

            .platform-select:focus {
                border-color: #4285f4;
                box-shadow: 0 0 0 1px #4285f4;
            }

            .buttons {
                display: flex;
                gap: 12px;
            }

            .btn {
                height: 36px;
                padding: 0 16px;
                font-size: 14px;
                background-color: #f8f9fa;
                border: 1px solid #f8f9fa;
                border-radius: 4px;
                color: #3c4043;
                cursor: pointer;
            }

            .btn:hover {
                box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
                background-color: #f8f9fa;
                border: 1px solid #dadce0;
                color: #202124;
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .btn-primary {
                background-color: #4285f4;
                border-color: #4285f4;
                color: #fff;
            }

            .btn-primary:hover {
                background-color: #3b78e7;
                border-color: #3b78e7;
                color: #fff;
                box-shadow: 0 1px 3px rgba(66, 133, 244, 0.4);
            }

            .status {
                margin-top: 20px;
                text-align: center;
                color: #5f6368;
                font-size: 14px;
                min-height: 24px;
            }

            .status.error {
                color: #d93025;
            }

            .error-box {
                margin-top: 20px;
                padding: 16px;
                background-color: #fce8e6;
                border-radius: 8px;
                border-left: 4px solid #d93025;
                max-width: 500px;
                text-align: left;
            }

            .error-box .error-title {
                font-weight: bold;
                color: #d93025;
                margin-bottom: 8px;
                font-size: 14px;
            }

            .error-box .error-message {
                color: #5f6368;
                font-size: 13px;
                word-break: break-word;
            }

            .error-box .error-detail {
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid #f5c6cb;
                color: #80868b;
                font-size: 12px;
                font-family: monospace;
            }

            .spinner {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 2px solid #dfe1e5;
                border-top-color: #4285f4;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                vertical-align: middle;
                margin-right: 8px;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .progress-bar {
                width: 300px;
                max-width: 90vw;
                height: 4px;
                background-color: #e0e0e0;
                border-radius: 2px;
                margin-top: 12px;
                overflow: hidden;
                display: none;
            }

            .progress-bar.visible {
                display: block;
            }

            .progress-fill {
                height: 100%;
                background-color: #4285f4;
                border-radius: 2px;
                transition: width 0.3s ease;
                width: 0;
            }

            .progress-fill.indeterminate {
                width: 30%;
                animation: indeterminate 1.5s ease-in-out infinite;
            }

            @keyframes indeterminate {
                0%   { transform: translateX(-100%); }
                100% { transform: translateX(400%); }
            }

            .hint {
                margin-top: 32px;
                font-size: 12px;
                color: #9aa0a6;
                text-align: center;
                max-width: 500px;
                line-height: 1.6;
            }

            .hint code {
                background: #f1f3f4;
                padding: 1px 5px;
                border-radius: 3px;
                font-size: 11px;
            }

            footer {
                position: fixed;
                bottom: 12px;
                font-size: 12px;
                color: #bdc1c6;
            }

            footer a {
                color: #bdc1c6;
                text-decoration: none;
            }

            footer a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo">
                <img src="/logo.svg" alt="Docker Image Downloader" />
            </div>

            <h1 class="app-title">Docker Image Downloader</h1>

            <form class="search-box" id="downloadForm">
                <div class="search-wrapper">
                    <input
                        type="text"
                        class="search-input"
                        id="imageName"
                        name="name"
                        placeholder="ubuntu:24.04"
                        autocomplete="off"
                        autofocus
                    />
                </div>

                <div class="platform-row" id="platformRow">
                    <span class="platform-label">OS:</span>
                    <select class="platform-select" id="osSelect"></select>
                    <span class="platform-label">Arch:</span>
                    <select class="platform-select" id="archSelect"></select>
                </div>

                <div class="buttons">
                    <button type="button" class="btn" id="detectBtn">
                        Detect platforms
                    </button>
                    <button type="submit" class="btn btn-primary" id="downloadBtn">
                        Download
                    </button>
                </div>
            </form>

            <div class="status" id="status"></div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="hint">
                Enter an image name and click <strong>Download</strong>. The file
                can be loaded with:<br />
                <code>docker load -i &lt;filename&gt;.tar</code><br /><br />
                For multi-arch images, click <strong>Detect platforms</strong>
                first to choose a specific OS / architecture.
            </div>
        </div>

        <footer>
            <a href="https://github.com/Basemax/python-docker-image-downloader" target="_blank" rel="noopener noreferrer">
                GitHub
            </a>
            &nbsp;·&nbsp; Python Docker Image Downloader
        </footer>

        <script>
            const form        = document.getElementById("downloadForm");
            const imageInput  = document.getElementById("imageName");
            const downloadBtn = document.getElementById("downloadBtn");
            const detectBtn   = document.getElementById("detectBtn");
            const platformRow = document.getElementById("platformRow");
            const osSelect    = document.getElementById("osSelect");
            const archSelect  = document.getElementById("archSelect");
            const status      = document.getElementById("status");
            const progressBar = document.getElementById("progressBar");
            const progressFill = document.getElementById("progressFill");

            let detectedForImage = null;

            function hidePlatforms() {
                detectedForImage = null;
                platformRow.classList.remove("visible");
                osSelect.innerHTML = "";
                archSelect.innerHTML = "";
            }

            imageInput.addEventListener("input", () => {
                hidePlatforms();
            });

            function parseError(errorMessage) {
                const result = {
                    title: "Download Failed",
                    message: errorMessage,
                    detail: null,
                };

                if (errorMessage.includes("image not found")) {
                    result.title = "Image Not Found";
                    result.message = "The requested image does not exist.";
                } else if (
                    errorMessage.includes("MANIFEST_UNKNOWN") ||
                    errorMessage.includes("manifest unknown")
                ) {
                    result.title = "Image Not Found";
                    result.message = "The requested image tag does not exist.";
                    const m = errorMessage.match(/unknown tag=([^\s}"]+)/);
                    if (m) result.detail = `Tag "${m[1]}" was not found in the registry.`;
                } else if (
                    errorMessage.includes("NAME_UNKNOWN") ||
                    errorMessage.includes("name unknown")
                ) {
                    result.title = "Repository Not Found";
                    result.message = "The requested repository does not exist.";
                } else if (errorMessage.includes("access denied")) {
                    result.title = "Access Denied";
                    result.message = "The image may not exist, or you need credentials to access it.";
                } else if (
                    errorMessage.includes("UNAUTHORIZED") ||
                    errorMessage.includes("unauthorized")
                ) {
                    result.title = "Authentication Required";
                    result.message = "You need to be authenticated to access this image.";
                } else if (
                    errorMessage.includes("DENIED") ||
                    errorMessage.includes("denied")
                ) {
                    result.title = "Access Denied";
                    result.message = "You do not have permission to access this image.";
                } else if (
                    errorMessage.includes("connection refused") ||
                    errorMessage.includes("no such host")
                ) {
                    result.title = "Connection Error";
                    result.message = "Could not connect to the registry server.";
                } else if (
                    errorMessage.includes("timeout") ||
                    errorMessage.includes("Timeout")
                ) {
                    result.title = "Request Timeout";
                    result.message = "The request took too long to complete.";
                } else if (errorMessage.includes("image name cannot be empty")) {
                    result.title = "Invalid Image Name";
                    result.message = "Image name cannot be empty.";
                } else if (errorMessage.includes("image name too long")) {
                    result.title = "Invalid Image Name";
                    result.message = "Image name is too long (maximum 256 characters).";
                } else if (
                    errorMessage.includes("invalid characters") ||
                    errorMessage.includes("contains invalid characters")
                ) {
                    result.title = "Invalid Image Name";
                    result.message = "Image name contains invalid characters.";
                } else if (errorMessage.includes("invalid image name")) {
                    result.title = "Invalid Image Name";
                    result.message = "The image name format is not valid.";
                    const m = errorMessage.match(/invalid image name:\s*(.+)/i);
                    if (m) result.detail = m[1];
                } else if (errorMessage.includes("authentication failed")) {
                    result.title = "Authentication Failed";
                    result.message = "Failed to authenticate with the registry.";
                    const m = errorMessage.match(/(\d{3})\s*-/);
                    if (m) result.detail = `Server returned status ${m[1]}`;
                } else if (errorMessage.includes("unexpected status")) {
                    result.title = "Registry Error";
                    result.message = "Received an unexpected response from the registry.";
                    const m = errorMessage.match(/unexpected status:\s*(\d+)/);
                    if (m) result.detail = `Status code: ${m[1]}`;
                } else if (errorMessage.includes("failed to get manifest")) {
                    result.title = "Manifest Error";
                    result.message = "Could not retrieve the image manifest from the registry.";
                    const m = errorMessage.match(/(\d{3})\s*-/);
                    if (m) result.detail = `Server returned status ${m[1]}`;
                } else if (errorMessage.includes("no manifest found for platform")) {
                    result.title = "Platform Not Available";
                    result.message = "This image does not support the selected platform.";
                    result.detail = 'Use "Detect platforms" to see what is available.';
                } else if (errorMessage.includes("failed to download")) {
                    result.title = "Download Error";
                    result.message = "Failed to download one or more image layers.";
                }

                return result;
            }

            function clearStatus() {
                while (status.firstChild) status.removeChild(status.firstChild);
                status.classList.remove("error");
            }

            function setStatusWithSpinner(text) {
                clearStatus();
                const spinner = document.createElement("span");
                spinner.className = "spinner";
                status.appendChild(spinner);
                status.appendChild(document.createTextNode(text));
            }

            function showError(errorMessage) {
                const error = parseError(errorMessage);
                clearStatus();

                const box = document.createElement("div");
                box.className = "error-box";

                const title = document.createElement("div");
                title.className = "error-title";
                title.textContent = error.title;
                box.appendChild(title);

                const msg = document.createElement("div");
                msg.className = "error-message";
                msg.textContent = error.message;
                box.appendChild(msg);

                if (error.detail) {
                    const detail = document.createElement("div");
                    detail.className = "error-detail";
                    detail.textContent = error.detail;
                    box.appendChild(detail);
                }

                status.appendChild(box);
            }

            detectBtn.addEventListener("click", async () => {
                const imageName = imageInput.value.trim();
                if (!imageName) {
                    status.textContent = "Please enter an image name first";
                    status.classList.add("error");
                    return;
                }

                clearStatus();
                setStatusWithSpinner("Detecting available platforms…");
                detectBtn.disabled = true;
                hidePlatforms();

                try {
                    const resp = await fetch(
                        `/platforms?name=${encodeURIComponent(imageName)}`
                    );
                    const data = await resp.json();

                    if (!resp.ok) {
                        showError(data.error || "Failed to detect platforms");
                        return;
                    }

                    const platforms = (data.platforms || []).filter(
                        (p) =>
                            p.os && p.os !== "unknown" &&
                            p.architecture && p.architecture !== "unknown"
                    );

                    if (platforms.length === 0) {
                        status.textContent =
                            "Single-arch image, no platform selection needed.";
                        return;
                    }

                    const osValues = [...new Set(platforms.map((p) => p.os))];
                    const archValues = [
                        ...new Set(
                            platforms.map((p) =>
                                p.variant
                                    ? p.architecture + "/" + p.variant
                                    : p.architecture
                            )
                        ),
                    ];

                    osSelect.innerHTML = "";
                    osValues.forEach((o) => {
                        const opt = document.createElement("option");
                        opt.value = o;
                        opt.textContent = o;
                        osSelect.appendChild(opt);
                    });

                    archSelect.innerHTML = "";
                    archValues.forEach((a) => {
                        const opt = document.createElement("option");
                        opt.value = a;
                        opt.textContent = a;
                        archSelect.appendChild(opt);
                    });

                    detectedForImage = imageName;
                    platformRow.classList.add("visible");
                    clearStatus();
                } catch (err) {
                    showError(err.message);
                } finally {
                    detectBtn.disabled = false;
                }
            });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const imageName = imageInput.value.trim();
                if (!imageName) {
                    status.textContent = "Please enter an image name";
                    status.classList.add("error");
                    return;
                }

                let url = `/image?name=${encodeURIComponent(imageName)}`;

                if (detectedForImage === imageName) {
                    const selectedOS = osSelect.value;
                    const selectedArch = archSelect.value;
                    const archParts = selectedArch.split("/");
                    const arch = archParts[0];
                    const variant = archParts[1] || "";
                    url += `&os=${encodeURIComponent(selectedOS)}&arch=${encodeURIComponent(arch)}`;
                    if (variant) {
                        url += `&variant=${encodeURIComponent(variant)}`;
                    }
                }

                clearStatus();
                setStatusWithSpinner("Preparing download…");
                progressBar.classList.add("visible");
                progressFill.style.width = "0%";
                progressFill.classList.add("indeterminate");
                downloadBtn.disabled = true;
                detectBtn.disabled = true;

                try {
                    const resp = await fetch(url);

                    if (!resp.ok) {
                        const errorData = await resp.json();
                        throw new Error(errorData.error || "Download failed");
                    }

                    const contentLength = resp.headers.get("Content-Length");
                    const totalBytes = contentLength ? parseInt(contentLength, 10) : 0;

                    const disposition = resp.headers.get("Content-Disposition");
                    let filename = "image.tar";
                    if (disposition) {
                        const m = disposition.match(/filename="(.+)"/);
                        if (m) {
                            let sanitized = m[1]
                                .replace(/[^a-zA-Z0-9._\-]/g, "_")
                                .replace(/^\.+/, "")
                                .substring(0, 255);
                            if (sanitized && /^[a-zA-Z0-9][a-zA-Z0-9._\-]*$/.test(sanitized)) {
                                filename = sanitized;
                            }
                        }
                    }

                    const reader = resp.body.getReader();
                    const chunks = [];
                    let received = 0;

                    progressFill.classList.remove("indeterminate");
                    setStatusWithSpinner("Downloading…");

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        chunks.push(value);
                        received += value.length;

                        if (totalBytes > 0) {
                            const pct = Math.min(
                                100,
                                Math.max(0, Math.round((received / totalBytes) * 100))
                            );
                            progressFill.style.width = pct + "%";
                            const mbDone  = (received / 1_048_576).toFixed(1);
                            const mbTotal = (totalBytes / 1_048_576).toFixed(1);
                            setStatusWithSpinner(
                                `Downloading… ${mbDone} MB / ${mbTotal} MB (${pct}%)`
                            );
                        } else {
                            setStatusWithSpinner(
                                `Downloading… ${(received / 1_048_576).toFixed(1)} MB`
                            );
                        }
                    }

                    const blob = new Blob(chunks);
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);

                    imageInput.value = "";
                    hidePlatforms();
                    clearStatus();
                    status.textContent = `Download complete! (${(received / 1_048_576).toFixed(1)} MB)`;
                    progressBar.classList.remove("visible");
                    progressFill.style.width = "0%";

                } catch (err) {
                    showError(err.message);
                    progressBar.classList.remove("visible");
                } finally {
                    downloadBtn.disabled = false;
                    detectBtn.disabled = false;
                }
            });
        </script>
    </body>
</html>
